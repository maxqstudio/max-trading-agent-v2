[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "max-trading-agent-v2"
version = "2.0.0"
description = "Battle-ready self-improving MT5 M1-M5 scalping agent with Full Hybrid AI (DL 1D-CNN + Calibrated ML + Dual RL + LLM Reflection)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
